<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00f0ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PanicCTRL Cloud Gateway</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 30%, #06101e 0%, #020408 100%);
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }
    .node-card {
      background: rgba(8, 14, 24, 0.9);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      border-radius: 20px;
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.25), inset 0 0 30px rgba(0, 0, 0, 0.8);
      padding: 36px 24px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      position: relative;
      backdrop-filter: blur(16px);
    }
    .radar-box {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 50%;
      border: 2px solid #00f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
    }
    .radar-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #00f0ff;
      animation: pulse 1.8s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }
    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
      margin-bottom: 6px;
    }
    .brand-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: #00f0ff;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 8px 16px;
      border-radius: 30px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: #00f0ff;
      margin-bottom: 20px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #00f0ff;
      border-radius: 50%;
      box-shadow: 0 0 8px #00f0ff;
      animation: blink 1s infinite alternate;
    }
    @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }
    .msg-box {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: #aaa;
      line-height: 1.5;
      min-height: 48px;
    }
    .btn-action {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(135deg, #00f0ff, #0088ff);
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 900;
      padding: 14px 24px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
      margin-top: 20px;
      width: 100%;
      cursor: pointer;
      border: none;
    }
    .install-btn {
      background: transparent;
      border: 1px solid rgba(0, 240, 255, 0.5);
      color: #00f0ff;
      font-size: 11px;
      padding: 10px 18px;
      margin-top: 12px;
    }
  </style>
</head>
<body>

<div class="node-card">
  <div class="radar-box">
    <div class="radar-pulse"></div>
    <span style="font-size:36px;">🛡️</span>
  </div>

  <div class="brand-title">PANIC CTRL</div>
  <div class="brand-sub">PERMANENT CLOUD GATEWAY</div>

  <div class="status-badge">
    <div class="status-dot"></div>
    <span id="badgeText">SEARCHING CLOUD NODE...</span>
  </div>

  <div class="msg-box" id="msgBox">
    Locating your live PC stream from GitHub Cloud...
  </div>

  <a id="directLinkBtn" class="btn-action" style="display:none;" href="#">
    ⚡ OPEN DASHBOARD NOW 🚀
  </a>

  <button id="pwaBtn" class="btn-action install-btn" style="display:none;" onclick="installGatewayApp()">
    📲 INSTALL AS APP (HOME SCREEN)
  </button>
</div>

<script>
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    var btn = document.getElementById('pwaBtn');
    if (btn) btn.style.display = 'block';
  });

  function installGatewayApp() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function() { deferredPrompt = null; });
    } else {
      alert("Tap Chrome 3-dot menu (⋮) -> 'Install app' or 'Add to Home screen'");
    }
  }

  var PERMANENT_TARGET = "https://ungodly-immature-share.ngrok-free.dev/?key=imran2024";

  function resolveCloudNode() {
    var badge = document.getElementById("badgeText");
    var msg = document.getElementById("msgBox");
    var directBtn = document.getElementById("directLinkBtn");

    badge.textContent = "CONNECTED TO PC!";
    msg.innerHTML = "Opening your live dashboard...<br><b style='color:#00f0ff; font-size:12px;'>ungodly-immature-share.ngrok-free.dev</b>";
    
    directBtn.href = PERMANENT_TARGET;
    directBtn.style.display = "block";

    // Instant redirection
    window.location.href = PERMANENT_TARGET;
  }

  resolveCloudNode();
</script>

</body>
</html>
